name: SupportPilot CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  # -------------------------
  # Backend checks
  # -------------------------
  backend:
    name: Backend - Python
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: supportpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supportpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      CI: "true"
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://supportpilot_app:app_test_password@localhost:5432/supportpilot
      TEST_DATABASE_URL: postgresql+asyncpg://supportpilot_app:app_test_password@localhost:5432/supportpilot
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local Compose configuration
        run: docker compose -f ../compose.yaml config --quiet
        env:
          POSTGRES_DB: supportpilot
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: ci-compose-validation-only

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provision isolated database roles
        run: python scripts/provision_ci_database_roles.py
        env:
          CI_SUPERUSER_DATABASE_URL: postgresql://postgres:postgres_test_password@localhost:5432/supportpilot
          POSTGRES_DB: supportpilot
          APP_DB_USER: supportpilot_app
          APP_DB_PASSWORD: app_test_password
          MIGRATION_DB_USER: supportpilot_migrator
          MIGRATION_DB_PASSWORD: migrator_test_password

      - name: Ruff lint
        run: ruff check app tests migrations scripts

      - name: Check committed OpenAPI contract
        run: python scripts/export_openapi.py --check

      - name: Apply test migrations with migrator role
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://supportpilot_migrator:migrator_test_password@localhost:5432/supportpilot

      - name: Verify restricted runtime database role and forced RLS
        run: python scripts/assert_runtime_db_role.py

      - name: Run tests
        run: pytest -q


  # -------------------------
  # Frontend checks
  # -------------------------
  frontend:
    name: Frontend - Next.js
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

      - name: Check generated API types
        run: npm run api:types:check

      - name: Production build
        run: npm run build

  # -------------------------
  # Full-stack browser workflows
  # -------------------------
  e2e:
    name: End-to-end - Support workflows
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: supportpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supportpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      APP_ENV: test
      APP_NAME: SupportPilot E2E
      DATABASE_URL: postgresql+asyncpg://supportpilot_app:app_test_password@localhost:5432/supportpilot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-e2e-only-secret-that-is-long-enough-and-randomized-${{ github.run_id }}
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      CORS_ORIGINS: '["http://127.0.0.1:3000"]'
      BACKEND_API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      E2E_PLATFORM_OWNER_EMAIL: platform-owner@example.com
      E2E_PLATFORM_OWNER_PASSWORD: ci-platform-owner-password-only
      SHOPIFY_CLIENT_ID: ci-shopify-client
      SHOPIFY_CLIENT_SECRET: ci-shopify-secret-not-a-real-credential
      SHOPIFY_REDIRECT_URI: https://supportpilot.example/api/integrations/shopify/callback
      SHOPIFY_API_VERSION: "2026-10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate disposable Shopify encryption key
        working-directory: backend
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.fernet import Fernet
          print(f"SHOPIFY_ENCRYPTION_KEY={Fernet.generate_key().decode('ascii')}")
          PY

      - name: Provision isolated database roles
        working-directory: backend
        run: python scripts/provision_ci_database_roles.py
        env:
          CI_SUPERUSER_DATABASE_URL: postgresql://postgres:postgres_test_password@localhost:5432/supportpilot
          POSTGRES_DB: supportpilot
          APP_DB_USER: supportpilot_app
          APP_DB_PASSWORD: app_test_password
          MIGRATION_DB_USER: supportpilot_migrator
          MIGRATION_DB_PASSWORD: migrator_test_password

      - name: Apply migrations with migrator role
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://supportpilot_migrator:migrator_test_password@localhost:5432/supportpilot

      - name: Verify restricted runtime database role and forced RLS
        working-directory: backend
        run: python scripts/assert_runtime_db_role.py

      - name: Create disposable platform owner
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          import os
          from app.core.security import hash_password
          from app.db.session import SessionLocal
          from app.models import PlatformOwner

          async def main():
              async with SessionLocal() as session:
                  session.add(PlatformOwner(
                      email=os.environ["E2E_PLATFORM_OWNER_EMAIL"],
                      password_hash=hash_password(os.environ["E2E_PLATFORM_OWNER_PASSWORD"]),
                  ))
                  await session.commit()

          asyncio.run(main())
          PY

      - name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/supportpilot-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 2
          done
          cat /tmp/supportpilot-api.log
          exit 1

      - name: Start document worker
        working-directory: backend
        run: python -m app.worker > /tmp/supportpilot-worker.log 2>&1 &

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser workflows
        working-directory: frontend
        run: npm run test:e2e

      - name: Preserve Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
