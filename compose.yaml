name: supportpilot-ai

services:

  # -----------------------------
  # PostgreSQL + pgvector
  # -----------------------------
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - supportpilot_network


  # -----------------------------
  # Redis
  # -----------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - supportpilot_network


  # -----------------------------
  # FastAPI Backend
  # -----------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_NAME: "SupportPilot AI"
      APP_ENV: development
      DEBUG: "true"

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379/0

      CORS_ORIGINS: '["http://localhost:3000"]'

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - supportpilot_network


  # -----------------------------
  # Next.js Frontend
  # -----------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}

    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

    networks:
      - supportpilot_network


# -----------------------------
# Persistent volumes
# -----------------------------
volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:


# -----------------------------
# Internal network
# -----------------------------
networks:
  supportpilot_network:
    driver: bridge
