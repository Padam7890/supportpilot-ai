name: supportpilot-ai

services:

  # -----------------------------
  # PostgreSQL + pgvector
  # -----------------------------
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-supportpilot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change_this_app_password}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-supportpilot_migrator}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-change_this_migration_password}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - supportpilot_network


  # -----------------------------
  # Redis
  # -----------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - supportpilot_network


  # -----------------------------
  # FastAPI Backend
  # -----------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_NAME: "SupportPilot AI"
      APP_ENV: development
      DEBUG: "true"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"

      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-supportpilot_app}:${APP_DB_PASSWORD:-change_this_app_password}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-45}
      AI_PROVIDER_MAX_ATTEMPTS: ${AI_PROVIDER_MAX_ATTEMPTS:-2}
      AI_INPUT_COST_PER_MILLION: ${AI_INPUT_COST_PER_MILLION:-}
      AI_OUTPUT_COST_PER_MILLION: ${AI_OUTPUT_COST_PER_MILLION:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}

      CORS_ORIGINS: '["http://localhost:3000"]'

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - supportpilot_network


  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: "SupportPilot Document Worker"
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-supportpilot_app}:${APP_DB_PASSWORD:-change_this_app_password}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-45}
      AI_PROVIDER_MAX_ATTEMPTS: ${AI_PROVIDER_MAX_ATTEMPTS:-2}
      AI_INPUT_COST_PER_MILLION: ${AI_INPUT_COST_PER_MILLION:-}
      AI_OUTPUT_COST_PER_MILLION: ${AI_OUTPUT_COST_PER_MILLION:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - supportpilot_network


  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: "SupportPilot AI"
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${MIGRATION_DB_USER:-supportpilot_migrator}:${MIGRATION_DB_PASSWORD:-change_this_migration_password}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      CORS_ORIGINS: '["http://localhost:3000"]'
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - supportpilot_network


  test-postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_DB: supportpilot_test
      POSTGRES_USER: supportpilot_test_admin
      POSTGRES_PASSWORD: supportpilot_test_admin_password
      APP_DB_USER: supportpilot_test_app
      APP_DB_PASSWORD: supportpilot_test_app_password
      MIGRATION_DB_USER: supportpilot_test_migrator
      MIGRATION_DB_PASSWORD: supportpilot_test_migrator_password
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supportpilot_network


  test-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["test"]
    environment:
      APP_NAME: "SupportPilot AI Test"
      APP_DB_USER: supportpilot_test_app
      MIGRATION_DB_USER: supportpilot_test_migrator
      DATABASE_URL: postgresql+asyncpg://supportpilot_test_migrator:supportpilot_test_migrator_password@test-postgres:5432/supportpilot_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-only-secret-that-is-long-enough
    command: ["alembic", "upgrade", "head"]
    depends_on:
      test-postgres:
        condition: service_healthy
    networks:
      - supportpilot_network


  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["test"]
    environment:
      APP_NAME: "SupportPilot AI Test"
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://supportpilot_test_app:supportpilot_test_app_password@test-postgres:5432/supportpilot_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-only-secret-that-is-long-enough
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      TEST_DATABASE_URL: postgresql+asyncpg://supportpilot_test_app:supportpilot_test_app_password@test-postgres:5432/supportpilot_test
    command: ["pytest", "-p", "no:cacheprovider", "-q"]
    depends_on:
      test-postgres:
        condition: service_healthy
      test-migrate:
        condition: service_completed_successfully
    networks:
      - supportpilot_network


  # -----------------------------
  # Next.js Frontend
  # -----------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_API_URL: http://api:8000
      NEXT_PUBLIC_SUPPORTPILOT_APP_URL: ${NEXT_PUBLIC_SUPPORTPILOT_APP_URL:-}
      OPENAPI_SCHEMA: /app/backend-openapi.json

    command: ["sh", "/app/docker-entrypoint.sh"]

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

    volumes:
      - ./frontend:/app
      - ./backend/openapi.json:/app/backend-openapi.json:ro
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

    networks:
      - supportpilot_network


# -----------------------------
# Persistent volumes
# -----------------------------
volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:


# -----------------------------
# Internal network
# -----------------------------
networks:
  supportpilot_network:
    driver: bridge
